# MusaCloud: self-hosted file and photo storage (Nextcloud)
# Start:  docker compose up -d      Stop:  docker compose down
# All passwords and keys come from the .env file.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  app:
    image: nextcloud:stable-apache
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      # Only this machine can reach the app.
      # Tailscale Serve is the only way in from your phone or laptop.
      - "127.0.0.1:8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: ${TAILSCALE_HOSTNAME}
      # Tailscale Serve provides HTTPS in front of the app
      OVERWRITEPROTOCOL: https
      OVERWRITEHOST: ${TAILSCALE_HOSTNAME}
      # Lets Nextcloud see the real IP of each visitor (useful for your Splunk logs later)
      TRUSTED_PROXIES: 172.16.0.0/12
      PHP_UPLOAD_LIMIT: 10G
    volumes:
      - ./nextcloud:/var/www/html

  # Runs Nextcloud's background jobs (cleanup, photo previews) every 5 minutes
  cron:
    image: nextcloud:stable-apache
    restart: unless-stopped
    depends_on:
      - app
    entrypoint: /cron.sh
    volumes:
      - ./nextcloud:/var/www/html
